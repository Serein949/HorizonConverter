name: Bug report
description: Something converted wrong, crashed, or produced an unreadable file
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For texture/model problems, a sample file makes
        the difference between "cannot reproduce" and a fix — but please do not
        upload assets you do not own.

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the window title, in `HorizonConverter --version`, or in the Android log line.
      placeholder: "1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows GUI
        - Windows CLI
        - Android
    validations:
      required: true

  - type: input
    id: mode
    attributes:
      label: Mode
      description: Sidebar entry or `-m` value, e.g. `image2ttx`, `ttx2png`, `tmb2obj`.
      placeholder: image2ttx
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: Smallest sequence of steps that shows the problem.
      placeholder: |
        1. Dropped livery.png (2048x2048)
        2. Format DXT5, texture size Match original
        3. Clicked Convert
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the log lines from the GUI/Android log panel or the CLI output.
      render: text
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source file
      description: Name, format and size of the input, e.g. `ext01_fuselage_color.ttx`, `type_rgb_astc_6x6 2048x2048 mips=12`.
      placeholder: ext01_fuselage_color.ttx - type_rgb_s3tc_dxt1 2048x2048 mips=12

  - type: checkboxes
    id: sanity
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest release
        - label: I checked that the input file itself is not corrupt
