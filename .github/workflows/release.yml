name: release

# Push a tag like v1.0 to build and publish a GitHub release.
#
# Required repository secrets for APK signing:
#   KEYSTORE_BASE64     base64 of keys/horizon-release.keystore
#   KEYSTORE_PASSWORD   store password
#   KEY_ALIAS           key alias (horizon)
#   KEY_PASSWORD        key password (may equal the store password)
#
# Optional (SignPath Foundation / Azure Trusted Signing): see RELEASING.md §5.
# Until those are configured the executables are shipped unsigned, and the notes
# should say so (SmartScreen will warn).

on:
  push:
    tags: ['v*']
    branches-ignore: ['**']   # branch pushes must never trigger a release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $version = $tag.TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building $version"

      - name: Publish CLI
        run: >
          dotnet publish src/AeroflyConv.Cli/AeroflyConv.Cli.csproj -c Release -r win-x64
          --self-contained true /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true
          /p:DebugType=none -o out/cli

      - name: Publish GUI
        run: >
          dotnet publish src/AeroflyConv.Gui/AeroflyConv.Gui.csproj -c Release -r win-x64
          --self-contained true /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true
          /p:DebugType=none -o out/gui

      # Optional: sign the executables. Enable by filling in the SignPath secrets,
      # then uncomment this step (it needs an organisation/project id from SignPath).
      # - name: Sign executables
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: horizon-converter
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: exe
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: out/signed

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'release.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}"))
          "ANDROID_KEYSTORE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build APK
        shell: pwsh
        run: |
          $args = @('src/AeroflyConv.Android/AeroflyConv.Android.csproj', '-c', 'Release')
          if ($env:ANDROID_KEYSTORE) {
            $args += "-p:AndroidKeyStore=true"
            $args += "-p:AndroidSigningKeyStore=$env:ANDROID_KEYSTORE"
            $args += "-p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }}"
            $args += "-p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}"
            $args += "-p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}"
          }
          dotnet build @args

      - name: Collect artifacts
        shell: pwsh
        run: |
          $v = $env:VERSION
          New-Item -ItemType Directory -Force out/assets | Out-Null
          Copy-Item out/cli/HorizonConverter.exe "out/assets/HorizonConverter-$v-win-cli.exe"
          Copy-Item out/gui/HorizonConverter.exe "out/assets/HorizonConverter-$v-win-gui.exe"
          $apk = Get-ChildItem 'src/AeroflyConv.Android/bin/Release/net10.0-android/*-Signed.apk' | Select-Object -First 1
          Copy-Item $apk.FullName "out/assets/HorizonConverter-$v.apk"
          Push-Location out/assets
          Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding utf8
          Pop-Location
          Get-ChildItem out/assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Horizon Converter ${{ env.VERSION }}
          draft: true
          generate_release_notes: true
          files: |
            out/assets/HorizonConverter-${{ env.VERSION }}-win-cli.exe
            out/assets/HorizonConverter-${{ env.VERSION }}-win-gui.exe
            out/assets/HorizonConverter-${{ env.VERSION }}.apk
            out/assets/SHA256SUMS.txt
